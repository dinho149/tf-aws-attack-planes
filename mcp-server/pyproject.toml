[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aws-audit-planes-mcp"
version = "0.1.0"
description = "MCP server that audits AWS audit-log configuration and runs the Field Guide investigations across the five attack planes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "tf-aws-attack-planes" }]
keywords = ["mcp", "aws", "cloudtrail", "audit-logs", "security", "athena", "guardduty"]
dependencies = [
    "mcp[cli]>=1.2.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "moto>=5.0",
]

[project.scripts]
aws-audit-planes-mcp = "audit_planes_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/audit_planes_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
